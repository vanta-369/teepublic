<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TeePublic Uploader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <h1>TeePublic Uploader</h1>
        <p id="ext-id" class="muted"></p>
      </div>
    </div>
  </header>

  <section id="auth" class="auth">
    <form id="auth-form" class="auth-form" hidden>
      <input id="auth-email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="auth-pass" type="password" placeholder="Password" autocomplete="current-password" required />
      <button id="auth-signin" type="submit" class="primary small">Sign in</button>
      <p id="auth-error" class="auth-error"></p>
    </form>
    <div id="auth-status" class="auth-status" hidden>
      <span id="auth-badge" class="badge"></span>
      <span id="auth-email-label" class="muted-sm"></span>
      <span class="auth-spacer"></span>
      <a id="auth-upgrade" class="small" target="_blank" rel="noopener" hidden>Upgrade</a>
      <button id="auth-signout" class="small">Sign out</button>
    </div>
    <p id="auth-note" class="muted-sm" hidden></p>
  </section>

  <section class="stats">
    <div><span class="label">Total</span><span id="s-total" class="stat">0</span></div>
    <div><span class="label">Picked</span><span id="s-picked" class="stat info">0</span></div>
    <div><span class="label">Done</span><span id="s-done" class="stat ok">0</span></div>
    <div><span class="label">Failed</span><span id="s-fail" class="stat err">0</span></div>
  </section>

  <section class="select-bar">
    <button id="btn-toggle-all" class="small"></button>
    <button id="btn-invert"     class="small">Invert</button>
    <button id="btn-mode"       class="small" title="Single = one design at a time (quick_create). Bulk = upload all at once (bulk_uploader).">Mode: Single</button>
    <button id="btn-log"        class="small" title="Copy the bulk run log to the clipboard">Copy log</button>
    <span id="picked-summary" class="muted-sm"></span>
  </section>

  <section id="grid" class="grid"></section>
  <nav id="pager" class="pager"></nav>

  <section class="actions">
    <button id="btn-start" class="primary">▶ Start</button>
    <button id="btn-pause">❚❚</button>
    <button id="btn-open">Queue ↗</button>
    <button id="btn-clear" class="danger">Clear</button>
  </section>

  <p id="empty" class="empty">No queue yet. Send one from the dashboard at <code>higgstee.com</code>.</p>

  <script type="module" src="main.js"></script>
</body>
</html>
